variables:
  KUBECTL_CONFIG: $KUBECTL_CONFIG
  IMAGEM_DOCKER: registry.fslab.dev/pablosmolak/api-academia
  ENV_CONFIG: $ENV_CONFIG
  ENV_CONFIG_TEST: $ENV_CONFIG_TEST

stages:
  - test
  - build
  - deploy

testar-jest:
  stage: test
  image: node:20
  services:
    - name: mysql:8
      alias: mysql
      command:
        - --default-authentication-plugin=mysql_native_password
  variables:
    # 👇 Essas variáveis vão ser passadas para o container MySQL automaticamente
    MYSQL_ROOT_PASSWORD: test1234
    MYSQL_DATABASE: academiaFSlabTest
    MYSQL_USER: test_user
    MYSQL_PASSWORD: test1234
    # 👇 E são usadas pelo seu app
    DATABASE_URL: "mysql://test_user:test1234@mysql:3306/academiaFSlabTest"
  only:
    - 39-criar-rotas-para-manipular-instrutores-do-curso
  before_script:
    # Espera o banco ficar disponível
    - echo "⏳ Aguardando MySQL subir..."
    - for i in {1..30}; do
        mysqladmin ping -hmysql -utest_user -ptest1234 --silent && break;
        sleep 2;
      done
    # Aplica as migrações (Prisma)
    - npx prisma migrate deploy
  script:
    - cat "$ENV_CONFIG_TEST" > .env.test
    - cat .env.test
    - npm ci
    - npm run test



