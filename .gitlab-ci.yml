variables:
  KUBECTL_CONFIG: $KUBECTL_CONFIG
  IMAGEM_DOCKER: registry.fslab.dev/pablosmolak/api-levantamento
  MYSQL_CONTAINER_NAME: mysql_db
  MYSQL_ROOT_PASSWORD: pablo123
  MYSQL_DATABASE: academiaFSlab
  MYSQL_USER: pablo
  MYSQL_PASSWORD: pablo123
  MYSQL_PORT: 3307

stages:
  - setup
  - build
  - deploy

setup-database:
  stage: setup
  services:
    - docker:dind
  script:
    - docker run -d --name $MYSQL_CONTAINER_NAME \
      -e MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD \
      -e MYSQL_DATABASE=$MYSQL_DATABASE \
      -e MYSQL_USER=$MYSQL_USER \
      -e MYSQL_PASSWORD=$MYSQL_PASSWORD \
      -p $MYSQL_PORT:3306 \
      -v $(pwd)/data:/var/lib/mysql \
      mysql:latest
    - sleep 10 # Aguarde o MySQL inicializar
    - docker ps # Verifica se o container do MySQL está rodando

buildar-docker:
  stage: build
  image: docker:dind
  only:
    - dev
  script:
    - cp .env.example .env 
    - >
      docker build 
      -t $IMAGEM_DOCKER
      -f DockerFile
      .
    - docker push $IMAGEM_DOCKER

fazer-deploy:
  stage: deploy
  needs: ['buildar-docker']
  image:
    name: bitnami/kubectl:latest
    entrypoint: ['']
  only:
    - dev
  script:
    - cat $KUBECTL_CONFIG > ~/.kube/config
    - kubectl config get-contexts
    - kubectl get node
    - kubectl get pods
    - kubectl delete deployment api-levantamento || true
    - kubectl apply -f deployment.yaml
    - sleep 60
    - kubectl get pods
    - kubectl describe deploy/api-levantamento
    - kubectl logs deploy/api-levantamento
