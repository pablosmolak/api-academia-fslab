apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-academia
spec:
  selector:
    matchLabels:
      app: api-academia
  template:
    metadata:
      labels:
        app: api-academia
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: api-academia
        image: ghcr.io/pablosmolak/api-academia:latest
        resources: {}
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-academia
  labels:
    rubix.expose: "true"
spec:
  type: ClusterIP
  selector:
    app: api-academia
  ports:
  - port: 80
    targetPort: 3000
