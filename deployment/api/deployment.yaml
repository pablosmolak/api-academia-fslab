apiVersion: v1
kind: ConfigMap
metadata:
  name: academia-env
data:
  DB_URL: "mysql://pablo:pablo123@rubix-mysql.shared:3306/academiaFSlab"
  PORT: "3000"
  JWT_EXPIRATION: "1d"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rubix-minio-config
data:
  MINIO_ENDPOINT: "rubix-minio-server.shared"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "imagens"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-academia
spec:
  selector:
    matchLabels:
      app: api-academia
  template:
    metadata:
      labels:
        app: api-academia
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: api-academia
        image: ghcr.io/pablosmolak/api-academia:latest
        envFrom:
        - configMapRef:
            name: academia-env
        - configMapRef:
            name: rubix-minio-config
        - secretRef:
            name: academia-admin-secret
        - secretRef:
            name: rubix-minio-secret
        resources: {}
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-academia
  labels:
    rubix.expose: "true"
spec:
  type: ClusterIP
  selector:
    app: api-academia
  ports:
  - port: 80
    targetPort: 3000