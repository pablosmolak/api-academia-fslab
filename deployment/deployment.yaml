apiVersion: v1
kind: ConfigMap
metadata:
  name: academia-env
data:
  DATABASE_URL: "mysql://pablo:pablo123@localhost:3307/academiaFSlab"
  PORT: "3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-academia
spec:
  selector:
    matchLabels:
      app: api-academia
  template:
    metadata:
      labels:
        app: api-academia
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: api-academia
        image: registry.fslab.dev/pablosmolak/api-academia:latest
        envFrom:
        - configMapRef:
            name: academia-env
        resources: {}
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-academia
spec:
  type: ClusterIP
  selector:
    app: api-academia
  ports:
  - port: 80
    targetPort: 3000