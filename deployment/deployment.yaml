apiVersion: v1
kind: ConfigMap
metadata:
  name: academia-env
data:
  DB_URL: "mysql://pablo:pablo123@rubix-mysql:3306/academiaFSlab"
  PORT: "3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-academia
spec:
  selector:
    matchLabels:
      app: api-academia
  template:
    metadata:
      labels:
        app: api-academia
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: api-academia
        image: ghcr.io/pablosmolak/api-academia:latest
        envFrom:
        - configMapRef:
            name: academia-env
        - configMapRef:
            name: rubix-minio-config
        - secretRef:
            name: academia-admin-secret
        resources: {}
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-academia
spec:
  type: ClusterIP
  selector:
    app: api-academia
  ports:
  - port: 80
    targetPort: 3000