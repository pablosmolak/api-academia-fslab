apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-academia
spec:
  resources:
    requests:
      storage: 1Gi
  accessModes:
    - ReadWriteOnce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-academia
spec:
  selector:
    matchLabels:
      app: minio-academia
  template:
    metadata:
      labels:
        app: minio-academia
    spec:
      containers:
      - name: minio-academia
        image: quay.io/minio/minio:latest
        args: ["server","/data","--console-address",":9001"]
        resources: {}
        ports:
        - containerPort: 9000
        - containerPort: 9001
        envFrom:
        - configMapRef:
            name: minio-academia-config
        volumeMounts:
          - mountPath: /data
            name: pv
      volumes:
      - name: pv
        persistentVolumeClaim:
          claimName: minio-academia
---
apiVersion: v1
kind: Service
metadata:
# Nome de host do minio
  name: minio-academia-server
spec:
  type: ClusterIP
  selector:
    app: minio-academia
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
# Nome de host do minio console
  name: minio-academia
spec:
  type: ClusterIP
  selector:
    app: minio-academia
  ports:
  - port: 80
    targetPort: 9001
