apiVersion: v1
kind: ConfigMap
metadata:
  name: academia-env
data:
  DATABASE_URL: "mysql://pablo:pablo123@localhost:3307/academiaFSlab"
  PORT: "3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-academia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-academia
  template:
    metadata:
      labels:
        app: api-academia
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: api-academia
        image: registry.fslab.dev/pablosmolak/api-academia:latest
        envFrom:
        - configMapRef:
            name: academia-env
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: api-academia
spec:
  type: ClusterIP
  selector:
    app: api-academia
  ports:
  - port: 80
    targetPort: 3000

---
apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate-job
spec:
  template:
    spec:
      containers:
      - name: prisma-migrate
        image: registry.fslab.dev/pablosmolak/api-academia:latest
        command: ["npx", "prisma", "migrate", "deploy"]
        envFrom:
        - configMapRef:
            name: academia-env
      restartPolicy: OnFailure
